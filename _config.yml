remote_theme: mmistakes/minimal-mistakes@4.28.1
minimal_mistakes_skin: mint

locale: de-DE
title: mesh-hn
description: MeshCore im Raum Heilbronn
url: https://mesh-hn.de
baseurl: ""
repository: mesh-hn/mesh-hn-website
timezone: Europe/Berlin

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-sitemap

permalink: /neuigkeiten/:year/:month/:day/:title/

footer:
  links:
    - label: "Impressum"
      icon: "fas fa-fw fa-scale-balanced"
      url: "https://impressum.mayer.rocks/"

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      toc: false
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      show_date: true
      read_time: false
      share: false

# Repo metadata for project-of-projects, not part of the site
exclude:
  - myproject.toml
  - LICENSE
